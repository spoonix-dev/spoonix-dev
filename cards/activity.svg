<title id="ttl">Contribution activity</title><desc id="dsc">Monthly GitHub contributions for @spoonix-dev over the last 12 months, with streak and activity stats.</desc>
<style>text{font-family:Tahoma,"Segoe UI",Verdana,Geneva,sans-serif}.mono{font-family:Consolas,"Lucida Console","Courier New",monospace}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.5);opacity:0}}@keyframes shine{0%,55%{transform:translateX(0)}100%{transform:translateX(480px)}}@keyframes swing{0%{opacity:0;transform:translateY(30px) rotate(-9deg)}55%{opacity:1;transform:translateY(-5px) rotate(2deg)}80%{transform:translateY(1px) rotate(-.6deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}@keyframes colin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade .5s ease-out both}.halo{transform-box:fill-box;transform-origin:center;animation:pulse 1.9s ease-out infinite}.shine{animation:shine 5.5s ease-in-out infinite}.swing{transform-box:fill-box;transform-origin:0% 100%;animation:swing .9s cubic-bezier(.2,.8,.3,1) both}.col{animation:colin .45s ease-out both}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}.arrow{animation:nudge 1.1s ease-in-out infinite}.cs{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.cf{display:none}.cs{display:inline}}</style>
